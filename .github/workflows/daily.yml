name: Daily

# Started once a day by Lambda CanaryDispatch in AWS (see lambda/). It's not a GitHub schedule,
# since GitHub turns those off after 60 days without a commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-canaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start each repo's canary
        env:
          GH_TOKEN: ${{ secrets.CANARY_TOKEN }}
        run: |
          failed=0
          while read -r repo; do
            if gh workflow run canary.yml --repo "andrewmacheret/$repo"; then
              echo "started $repo"
            else
              echo "::error title=$repo::couldn't start canary.yml"
              failed=1
            fi
          done < repos.txt
          exit $failed
