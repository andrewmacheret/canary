name: Test and deploy

on:
  push:
    branches: [master]
    # Only the Lambda is deployed. The health check files are used straight from the repo.
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'lambda/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FUNCTION_NAME: CanaryDispatch
  RUNTIME: nodejs24.x
  TOKEN_PARAMETER: /canary/github-token

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
        working-directory: lambda

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: zip -j lambda.zip lambda/index.mjs lambda/dispatch.mjs
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update runtime and settings
        run: |
          aws lambda update-function-configuration --function-name "$FUNCTION_NAME" \
            --runtime "$RUNTIME" --handler index.handler --timeout 30 --memory-size 128 \
            --environment "Variables={TOKEN_PARAMETER=$TOKEN_PARAMETER}" \
            --output text --query LastUpdateStatus
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
      - name: Update code
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip \
            --output text --query LastUpdateStatus
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
